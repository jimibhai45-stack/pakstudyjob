<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="psj-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Background Shield/Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#psj-grad)" />
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Academic Graduation Cap -->
  <polygon points="32,13 52,21 32,29 12,21" fill="#ffffff" />
  <polygon points="32,29 52,21 52,23 32,31" fill="#cbd5e1" />
  <path d="M22,25 v9 c0,4.5 4.5,8 10,8 s10,-3.5 10,-8 v-9" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" />
  
  <!-- Tassel -->
  <path d="M48,22.5 v11" stroke="url(#gold-grad)" stroke-width="2" stroke-linecap="round" />
  <circle cx="48" cy="34.5" r="2" fill="#fbbf24" />

  <!-- Open Book at Bottom -->
  <path d="M16,49 C22,46 28,46 32,48 C36,46 42,46 48,49 V53 C42,50 36,50 32,52 C28,50 22,50 16,53 Z" fill="#ffffff" />
  <line x1="32" y1="48" x2="32" y2="52" stroke="#1d4ed8" stroke-width="1.5" />

  <!-- Small Pakistani Star & Crescent Accent in Center -->
  <circle cx="32" cy="36" r="3.2" fill="url(#gold-grad)" />
  <circle cx="33.4" cy="35.2" r="2.6" fill="#1e293b" />
  <polygon points="34.2,35 34.6,36.2 35.8,36.2 34.8,37 35.2,38.2 34.2,37.4 33.2,38.2 33.6,37 32.6,36.2 33.8,36.2" fill="#fbbf24" transform="scale(0.55) translate(28, 28)" />
</svg>
